<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='payment.css') }}">
</head>
<body>
    <div class="card">
        <h2>Airport Lounge Payment</h2>

        <p class="success-text">Payments are secured & encrypted (mock)</p>
    </div>
</body>
